services:
  db:
    image: postgres:16-alpine
    container_name: rasheed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rasheed_user
      POSTGRES_PASSWORD: rasheed_pass
      POSTGRES_DB: rasheed_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasheed_user -d rasheed_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rasheed_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rasheed_user:rasheed_pass@db:5432/rasheed_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
