version: "3.9"

# ============================================================
# Finance & Savings Agent — Docker Compose (بنية تحتية فقط)
# لا منطق أعمال هون — فقط تشغيل الخدمات الأساسية للتطوير المحلي
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: finance_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finance_savings_db}
    ports:
      - "5432:5432"
    volumes:
      - finance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command: flask run --host=0.0.0.0 --port=5000

volumes:
  finance_db_data:

# ملاحظة: خدمة الموبايل (Flutter) ما بتنضاف هون —
# Flutter بيتطور محليًا / بمحاكي، مو عبر Docker عادةً.
