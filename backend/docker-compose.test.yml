# قاعدة PostgreSQL مخصصة للاختبارات فقط — منفذ 5433 (حتى ما تتعارض مع قاعدة التطوير)
# بيانات بالذاكرة (tmpfs): كل ما تطفيها بتروح، وهاد المطلوب للاختبارات.
#
# تشغيل:  docker compose -f docker-compose.test.yml up -d
# إيقاف:  docker compose -f docker-compose.test.yml down
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: rasheed_test
      POSTGRES_PASSWORD: rasheed_test
      POSTGRES_DB: rasheed_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasheed_test -d rasheed_test"]
      interval: 2s
      timeout: 3s
      retries: 20
