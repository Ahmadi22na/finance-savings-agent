name: CI

# ============================================================
# Finance & Savings Agent — CI أساسي
# Lint + Test للـ backend. 110 اختبار فعلي يغطي المشروع كامل
# (Sprints 0-9) — لازم تنجح فعليًا عشان أي PR ينضم لـ main.
# ما فيه أي خطوة Deploy — الاستضافة الحقيقية لسا مرحلة قادمة.
# ============================================================

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        working-directory: ./backend
        run: flake8 app --max-line-length=100 --extend-ignore=E203
        # لازم تنجح فعليًا — ما في داعي || true بعد، الكود موجود وواقعي

      - name: Run tests (pytest)
        working-directory: ./backend
        env:
          JWT_SECRET_KEY: test-only-secret-never-used-in-production
        run: pytest tests/ -v
        # لازم تنجح فعليًا — 110 اختبار حقيقي، مش "لا توجد اختبارات بعد"

  # agent-review-guard:
  # ملاحظة: قسم 10 بالتوثيق بيتطلب مراجعة إلزامية من شخص ثانٍ
  # لأي PR يمس backend/app/agent/. هاد شرط بشري (عبر GitHub branch
  # protection + CODEOWNERS) مو Job آلي بالـ CI — لازم يُضبط يدويًا
  # بإعدادات الـ repo (Settings → Branches → Require review).