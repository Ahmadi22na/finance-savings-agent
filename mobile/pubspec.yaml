name: rasheed_app
description: "تطبيق رشيد لإدارة المصاريف والتوفير"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- إدارة الحالة والحقن (State Management) ---
  flutter_riverpod: ^2.6.1

  # --- الاتصال بالـ Backend ---
  dio: ^5.7.0                    # HTTP client — أقوى وأنظف من http الأساسية (interceptors, error handling)
  flutter_secure_storage: ^9.2.2  # تخزين آمن للـ JWT tokens على الجهاز (مش SharedPreferences العادية)

  # --- أدوات عامة ---
  cupertino_icons: ^1.0.8
  intl: ^0.19.0                   # تنسيق التواريخ والأرقام (مهم للمبالغ المالية)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/personas/
